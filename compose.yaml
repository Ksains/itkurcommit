name: it-onboarding
services:
  web:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8000"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/data/participants.json').then(async r=>{if(!r.ok || !Array.isArray(await r.json()))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
